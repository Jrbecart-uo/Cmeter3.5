<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Board</title>
<style>
  :root {
    --bg: #0f1115; --card: #1b1f27; --edge: #2a2f3a;
    --txt: #e8eaed; --dim: #9aa0aa;
    --ok: #2ecc71; --down: #e74c3c; --unk: #7f8896;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--txt);
    font: 15px/1.4 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  header {
    display: flex; align-items: baseline; gap: 16px; flex-wrap: wrap;
    padding: 18px 24px; border-bottom: 1px solid var(--edge);
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header .meta { color: var(--dim); font-size: 13px; }
  header .summary { margin-left: auto; font-size: 14px; }
  header .summary b.ok { color: var(--ok); }
  header .summary b.down { color: var(--down); }
  header .summary b.unk { color: var(--unk); }
  .grid {
    display: grid; gap: 14px; padding: 24px;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  }
  .tile {
    background: var(--card); border: 1px solid var(--edge); border-radius: 12px;
    padding: 16px; display: flex; align-items: center; gap: 14px;
  }
  .dot {
    width: 26px; height: 26px; border-radius: 50%; flex: none;
    box-shadow: 0 0 0 4px rgba(255,255,255,.04);
  }
  .dot.ok   { background: var(--ok);   box-shadow: 0 0 10px 1px rgba(46,204,113,.5); }
  .dot.down { background: var(--down); box-shadow: 0 0 10px 1px rgba(231,76,60,.6); animation: pulse 1.4s infinite; }
  .dot.unknown { background: var(--unk); }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.45} }
  .tx { min-width: 0; }
  .tx .short { font-weight: 600; font-size: 15px; }
  .tx .name  { color: var(--dim); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tx .fail  { color: var(--down); font-size: 11.5px; margin-top: 3px; }
  .tx .detail{ color: var(--unk); font-size: 11px; margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  footer { color: var(--dim); font-size: 12px; padding: 0 24px 24px; }
  .stale { color: var(--down); }
</style>
</head>
<body>
  <header>
    <h1>Status Board</h1>
    <span class="meta" id="updated">loading...</span>
    <span class="summary" id="summary"></span>
  </header>
  <div class="grid" id="grid"></div>
  <footer id="footer"></footer>

<script>
const REFRESH_MS = 15000;
let lastGood = 0;

function tile(it) {
  const fail = it.last_failure
    ? `<div class="fail">last fail: ${it.last_failure}</div>` : "";
  const detail = it.detail ? `<div class="detail" title="${it.detail}">${it.detail}</div>` : "";
  return `<div class="tile">
    <div class="dot ${it.state}" title="${it.state}"></div>
    <div class="tx">
      <div class="short">${it.short}</div>
      <div class="name" title="${it.name}">${it.name}</div>
      ${fail}${detail}
    </div>
  </div>`;
}

async function refresh() {
  try {
    const r = await fetch("status.json", { cache: "no-store" });
    const d = await r.json();
    const items = d.items || [];
    document.getElementById("grid").innerHTML = items.map(tile).join("");
    const ok = items.filter(i => i.state === "ok").length;
    const down = items.filter(i => i.state === "down").length;
    const unk = items.filter(i => i.state === "unknown").length;
    document.getElementById("summary").innerHTML =
      `<b class="ok">${ok} ok</b> &nbsp; <b class="down">${down} down</b> &nbsp; <b class="unk">${unk} unknown</b>`;
    document.getElementById("updated").textContent = "polled " + (d.generated || "?");
    lastGood = Date.now();
    document.getElementById("footer").textContent =
      `Auto-refresh ${REFRESH_MS/1000}s. Source: statusboard on dt42.`;
  } catch (e) {
    const stale = Math.round((Date.now() - lastGood) / 1000);
    document.getElementById("footer").innerHTML =
      `<span class="stale">dashboard cannot reach statusboard (${stale}s stale): ${e}</span>`;
  }
}
refresh();
setInterval(refresh, REFRESH_MS);
</script>
</body>
</html>
